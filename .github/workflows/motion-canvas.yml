# Build workflow
name: Validate Motion Canvas studio
on:
  push:
    branches:
      - feature/motion-canvas-2d
    paths:
      - "apps/motion-canvas/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/motion-canvas.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-motion-canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type-check and build Motion Canvas
        run: pnpm --dir apps/motion-canvas build
      - uses: actions/upload-artifact@v4
        with:
          name: dato-y-relato-motion-canvas-studio
          path: apps/motion-canvas/dist
          if-no-files-found: error
          retention-days: 14
