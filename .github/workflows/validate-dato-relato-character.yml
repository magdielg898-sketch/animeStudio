name: Validate Dato y Relato character
on:
  push:
    paths:
      - "examples/characters/dato-relato-stickman.toon.json"
      - ".github/workflows/validate-dato-relato-character.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
      - name: Validate canonical character rig
        run: pnpm exec tsx packages/cli/src/bin.ts validate examples/characters/dato-relato-stickman.toon.json
      - name: Render idle, walk and run previews
        run: |
          mkdir -p out/character-preview
          pnpm exec tsx packages/cli/src/bin.ts render examples/characters/dato-relato-stickman.toon.json --time 0.8 --clip idle -o out/character-preview/idle.svg
          pnpm exec tsx packages/cli/src/bin.ts render examples/characters/dato-relato-stickman.toon.json --time 0.35 --clip walk -o out/character-preview/walk.svg
          pnpm exec tsx packages/cli/src/bin.ts render examples/characters/dato-relato-stickman.toon.json --time 0.22 --clip run -o out/character-preview/run.svg
      - uses: actions/upload-artifact@v4
        with:
          name: dato-y-relato-character-preview
          path: out/character-preview/*.svg
          if-no-files-found: error
          retention-days: 14
